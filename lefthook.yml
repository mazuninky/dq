pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --all -- --check
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    test:
      run: cargo nextest run --workspace --all-features

pre-push:
  commands:
    deny:
      # Git exports GIT_DIR (and friends) to hooks. cargo deny updates its advisory
      # database with git, which would then fetch and reset *this* repo instead.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR cargo deny check
