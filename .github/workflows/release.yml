name: Release

# Triggered by `vYYYY.WW.BUILD` tag pushes. The release flow:
#   1. verify-version : tag pattern + Cargo.toml workspace version match.
#   2. build (matrix) : per-target release binary, generated man/completions,
#                       packaged tar.gz/zip with a SHA256 sidecar.
#   3. release         : downloads every artifact, attests build provenance,
#                       creates the GitHub Release. Optional cosign signing
#                       runs only when COSIGN_PRIVATE_KEY is configured (no-op
#                       on forks without the secret).

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Validate tag and Cargo.toml version
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.(0[1-9]|[1-4][0-9]|5[0-3])\.[1-9][0-9]*$'; then
            echo "::error::Tag '$TAG' does not match vYYYY.WW.BUILD format" >&2
            exit 1
          fi

          # `cargo pkgid -p dq-cli` returns e.g. `path+file:///.../dq-cli#2026.20.1`.
          # The version is the substring after `#` (or `@` on newer cargo).
          CARGO_VERSION=$(cargo pkgid -p dq-cli | awk -F'[#@]' '{print $NF}')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo workspace version ($CARGO_VERSION) does not match tag ($VERSION). Run scripts/bump-version.sh before tagging." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: dq
            archive: tar.gz
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: dq
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: dq
            archive: tar.gz
            cross: false
          # Intel macOS, built on the arm64 runner: Apple's toolchain targets
          # x86_64 natively, so no cross toolchain. The binary may not run on
          # the runner, so the docs come from a host build (host_docs).
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: dq
            archive: tar.gz
            cross: false
            host_docs: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the toolchain cargo runs here, and the step
      # above adds the target to stable only. Without this, a target that is
      # neither the host nor set up by the cross toolchain action
      # (x86_64-apple-darwin) fails with "can't find crate for `core`".
      - name: Add the target to the pinned toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Cache cargo registry and target (release)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}

      # Cross targets first build a host-runnable binary purely so we can invoke
      # `dq generate-docs` to produce man pages / shell completions (output is
      # identical regardless of build target). This MUST happen before the
      # cross toolchain is set up, because taiki-e/setup-cross-toolchain-action
      # exports CARGO_BUILD_TARGET globally for the job — after that, every
      # plain `cargo build` cross-compiles, leaving `target/release/dq` empty
      # and any attempt to execute the binary on the host runner crashes
      # (exit 127, observed in run 25769046894). Targets with host_docs (a
      # binary the runner may not execute) take the same path.
      - name: Build host binary and generate docs (cross and host_docs targets)
        if: matrix.cross || matrix.host_docs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin dq
          ./target/release/dq generate-docs --output-dir dist/_docs

      - name: Set up cross toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dq

      - name: Generate docs (native targets only)
        if: ${{ !matrix.cross && !matrix.host_docs }}
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/${{ matrix.bin }}" generate-docs --output-dir dist/_docs

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          NAME="dq-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}/man" "dist/${NAME}/completions"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${NAME}/"
          cp LICENSE README.md "dist/${NAME}/"
          cp -R dist/_docs/man/. "dist/${NAME}/man/"
          cp -R dist/_docs/completions/. "dist/${NAME}/completions/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dq-${{ matrix.target }}
          path: |
            dist/dq-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/dq-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dq-*
          merge-multiple: true

      - name: Generate combined checksums file
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > dq-checksums.txt
          for f in dq-*.tar.gz; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> dq-checksums.txt
          done
          cat dq-checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dq-*.tar.gz

      # Step-level `env:` is NOT visible to the same step's `if:` expression,
      # and `secrets.*` cannot be referenced directly in `if:`. Detect once
      # in a tiny pre-step that exposes a boolean output, then gate the real
      # signing step on that output.
      - name: Detect cosign secret
        id: cosign_check
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign artifacts with cosign
        if: steps.cosign_check.outputs.available == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          cd dist
          for f in dq-*.tar.gz dq-checksums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${f}.sig" "${f}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.verify-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/dq-*.tar.gz
            dist/dq-*.tar.gz.sha256
            dist/dq-checksums.txt
            dist/dq-*.sig
          fail_on_unmatched_files: false
