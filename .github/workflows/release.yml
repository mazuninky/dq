name: Release

# Triggered by `vYYYY.WW.BUILD` tag pushes. The release flow:
#   1. verify-version : tag pattern + Cargo.toml workspace version match.
#   2. build (matrix) : per-target release binary, generated man/completions,
#                       packaged tar.gz/zip with a SHA256 sidecar.
#   3. release         : downloads every artifact, attests build provenance,
#                       creates the GitHub Release. Optional cosign signing
#                       runs only when COSIGN_PRIVATE_KEY is configured (no-op
#                       on forks without the secret).
#   4. bump-homebrew-tap : opens a PR against mazuninky/homebrew-tap with the
#                       new formula. Skipped if HOMEBREW_TAP_TOKEN is unset.

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Validate tag and Cargo.toml version
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.(0[1-9]|[1-4][0-9]|5[0-3])\.[1-9][0-9]*$'; then
            echo "::error::Tag '$TAG' does not match vYYYY.WW.BUILD format" >&2
            exit 1
          fi

          # `cargo pkgid -p dq-cli` returns e.g. `path+file:///.../dq-cli#2026.20.1`.
          # The version is the substring after `#` (or `@` on newer cargo).
          CARGO_VERSION=$(cargo pkgid -p dq-cli | awk -F'[#@]' '{print $NF}')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo workspace version ($CARGO_VERSION) does not match tag ($VERSION). Run scripts/bump-version.sh before tagging." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: dq
            archive: tar.gz
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: dq
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: dq
            archive: tar.gz
            cross: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target (release)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-${{ matrix.target }}

      # Cross targets first build a host-runnable binary purely so we can invoke
      # `dq generate-docs` to produce man pages / shell completions (output is
      # identical regardless of build target). This MUST happen before the
      # cross toolchain is set up, because taiki-e/setup-cross-toolchain-action
      # exports CARGO_BUILD_TARGET globally for the job — after that, every
      # plain `cargo build` cross-compiles, leaving `target/release/dq` empty
      # and any attempt to execute the binary on the host runner crashes
      # (exit 127, observed in run 25769046894).
      - name: Build host binary and generate docs (cross targets only)
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin dq
          ./target/release/dq generate-docs --output-dir dist/_docs

      - name: Set up cross toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@3d9770ce98eb7dbcf378563182a5e8031165f75b # v1.41.0
        with:
          target: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dq

      - name: Generate docs (native targets only)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/${{ matrix.bin }}" generate-docs --output-dir dist/_docs

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          NAME="dq-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}/man" "dist/${NAME}/completions"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${NAME}/"
          cp LICENSE README.md "dist/${NAME}/"
          cp -R dist/_docs/man/. "dist/${NAME}/man/"
          cp -R dist/_docs/completions/. "dist/${NAME}/completions/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dq-${{ matrix.target }}
          path: |
            dist/dq-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/dq-${{ needs.verify-version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dq-*
          merge-multiple: true

      - name: Generate combined checksums file
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          : > dq-checksums.txt
          for f in dq-*.tar.gz; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> dq-checksums.txt
          done
          cat dq-checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/dq-*.tar.gz

      # Step-level `env:` is NOT visible to the same step's `if:` expression,
      # and `secrets.*` cannot be referenced directly in `if:`. Detect once
      # in a tiny pre-step that exposes a boolean output, then gate the real
      # signing step on that output.
      - name: Detect cosign secret
        id: cosign_check
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign artifacts with cosign
        if: steps.cosign_check.outputs.available == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          cd dist
          for f in dq-*.tar.gz dq-checksums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${f}.sig" "${f}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.verify-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/dq-*.tar.gz
            dist/dq-*.tar.gz.sha256
            dist/dq-checksums.txt
            dist/dq-*.sig
          fail_on_unmatched_files: false

  bump-homebrew-tap:
    name: bump-homebrew-tap
    needs: [verify-version, release]
    runs-on: ubuntu-latest
    # Skipped automatically when HOMEBREW_TAP_TOKEN is unset (e.g. on a fork).
    # The token must be a PAT (or fine-grained token) with `contents: write`
    # and `pull-requests: write` scope on mazuninky/homebrew-tap.
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
    steps:
      - name: Check token presence
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping homebrew-tap bump." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout homebrew-tap
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mazuninky/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Fetch release sha256 sidecars
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p shasums
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            asset="dq-${VERSION}-${target}.tar.gz.sha256"
            gh release download "v${VERSION}" \
              --repo "${GH_REPO}" \
              --pattern "${asset}" \
              --dir shasums
            line=$(cat "shasums/${asset}")
            sha=$(printf '%s\n' "$line" | awk '{print $1}')
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::Unexpected sha256 sidecar format for ${asset}: $line" >&2
              exit 1
            fi
            printf '%s' "$sha" > "shasums/${target}.sha"
          done

      - name: Render formula
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          DARWIN_SHA=$(cat shasums/aarch64-apple-darwin.sha)
          LINUX_X86_SHA=$(cat shasums/x86_64-unknown-linux-gnu.sha)
          LINUX_ARM_SHA=$(cat shasums/aarch64-unknown-linux-gnu.sha)
          cat > tap/Formula/dq.rb <<EOF
          class Dq < Formula
            desc "Agent-friendly Rust CLI for structured data + linter platform"
            homepage "https://github.com/mazuninky/dq"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/mazuninky/dq/releases/download/v${VERSION}/dq-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${DARWIN_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/mazuninky/dq/releases/download/v${VERSION}/dq-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
              on_arm do
                url "https://github.com/mazuninky/dq/releases/download/v${VERSION}/dq-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
            end

            def install
              bin.install "dq"
              man1.install Dir["man/*.1"]
              bash_completion.install "completions/dq.bash" => "dq"
              zsh_completion.install "completions/_dq"
              fish_completion.install "completions/dq.fish"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dq --version")
            end
          end
          EOF

      - name: Open pull request
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
          SOURCE_REPO: ${{ github.repository }}
        working-directory: tap
        run: |
          set -euo pipefail
          BRANCH="bump-dq-${VERSION}"
          git config user.name "Mazunin Konstantin"
          git config user.email "mazuninky@gmail.com"

          git fetch origin "${BRANCH}" 2>/dev/null || true
          git checkout -B "${BRANCH}"

          git add Formula/dq.rb
          if git diff --cached --quiet; then
            echo "Formula already at v${VERSION}; nothing to do."
            exit 0
          fi

          git commit -m "dq ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"

          BODY=$(printf 'Auto-generated bump for dq %s.\n\nRelease: https://github.com/%s/releases/tag/v%s' \
            "${VERSION}" "${SOURCE_REPO}" "${VERSION}")

          if existing=$(gh pr view "${BRANCH}" --json number --jq '.number' 2>/dev/null); then
            gh pr edit "${existing}" --title "dq ${VERSION}" --body "${BODY}"
          else
            gh pr create \
              --title "dq ${VERSION}" \
              --body "${BODY}" \
              --base master \
              --head "${BRANCH}"
          fi
