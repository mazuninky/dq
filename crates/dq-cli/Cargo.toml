[package]
name = "dq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Both a library and a binary target — the library exposes `dq::run` so
# integration tests can drive the CLI in-process (no `assert_cmd` spawn) while
# still producing the standard `dq` binary.
[lib]
name = "dq"
path = "src/lib.rs"

[[bin]]
name = "dq"
path = "src/main.rs"

[dependencies]
dq-core = { path = "../dq-core" }
# M7: embedded jq engine, consumed by `dq query` and `dq set --jq`. Defaults
# to the `embedded-jq` feature, which links jaq-core / jaq-std / jaq-json.
dq-transform = { path = "../dq-transform" }
# M8: rule runtime (Evaluator, RuleLoader, RuleSet, RuleTester) consumed by
# the lint / check / test / explain / rules subcommands.
dq-exec = { path = "../dq-exec" }
# M8: embedded standard rule library (`@std/<ns>`) consumed by `rules list /
# add` and `explain` for std-namespace rule discovery.
dq-lint = { path = "../dq-lint" }
# Phase 5 of `add-ir-foundation`: WASM plugin runtime. The crate is linked
# unconditionally — its own `plugins` feature gates the wasmtime-backed
# implementation. Without the feature, `PluginRuntime::new()` returns
# `PluginError::FeatureDisabled` and the CLI surfaces a structured
# `InvalidInput` (exit 6) when the user passes `--plugins <DIR>` against a
# directory that contains at least one `*.wasm` file.
dq-plugin = { path = "../dq-plugin" }

clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
camino = { workspace = true }
jsonpath-rust = { workspace = true }
toon-format = { workspace = true }
globset = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }
# M6 distribution. `self_update` drives `dq self update` (atomic GitHub
# Releases download); `ureq` powers the `dq self check` API ping. Workspace
# defaults already disable OpenSSL in favour of rustls. `tempfile` is used
# by the `self update` install-dir writability probe (the dev-dependencies
# entry is for unit tests; this runtime entry is a separate consumer).
self_update = { workspace = true }
ureq = { workspace = true }
tempfile = { workspace = true }
# Unified-diff rendering for `dq set --diff` / `dq del --diff` (M2 §11).
# Default features cover the line-based unified-diff use case; `inline` /
# `text` features would only matter if we exposed character-level diffs,
# which the spec does not require.
similar = "3"

[features]
default = []
# Forwards to `dq-plugin/plugins`, which links wasmtime + the host-side WIT
# bindings. With this feature off (the default) `--plugins <DIR>` is a no-op
# unless the directory contains at least one `*.wasm` file, in which case the
# CLI errors with `InvalidInput` (exit 6) and the message
# `"plugins are not enabled in this build"`.
plugins = ["dq-plugin/plugins"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true, features = ["redactions", "json", "filters"] }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
dq-core = { path = "../dq-core" }
