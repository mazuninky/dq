[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "example-pkg"
version = "0.1.0"
description = "An example python package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]

[tool.ruff]
line-length = 100
