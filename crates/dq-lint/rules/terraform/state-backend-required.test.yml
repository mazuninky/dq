tests:
  - name: terraform block without backend fires
    input: |
      terraform {
        required_version = ">= 1.6"
      }
    expected:
      violations:
        - rule: terraform.state-backend-required
          message_contains: "no backend"
  - name: terraform block with s3 backend passes
    input: |
      terraform {
        required_version = ">= 1.6"
        backend "s3" {
          bucket = "tfstate"
          key    = "prod/terraform.tfstate"
          region = "us-east-1"
        }
      }
    expected:
      violations: []
  - name: file with no terraform block at all is silent
    input: |
      resource "aws_instance" "x" {
        ami = "ami-1"
      }
    expected:
      violations: []
  - name: terraform block with remote backend passes
    input: |
      terraform {
        backend "remote" {
          organization = "my-org"
          workspaces {
            name = "prod"
          }
        }
      }
    expected:
      violations: []
  - name: top-level attributes in place of blocks are skipped
    input: |
      resource = "x"
      variable = 1
      module = "m"
      terraform = "x"
      output = 1
      provider = "x"
    expected:
      violations: []
  - name: two terraform blocks without a backend fire
    input: |
      terraform {
        required_version = ">= 1.6"
      }
      terraform {
        required_providers {
          aws = {
            source = "hashicorp/aws"
          }
        }
      }
    expected:
      violations:
        - rule: terraform.state-backend-required
          message_contains: "no backend"
  - name: a backend in the first of two terraform blocks passes
    input: |
      terraform {
        backend "s3" {
          bucket = "tfstate"
        }
      }
      terraform {
        required_version = ">= 1.6"
      }
    expected:
      violations: []
