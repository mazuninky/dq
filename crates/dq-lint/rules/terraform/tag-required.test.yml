tests:
  - name: aws resource without tags fires
    input: |
      resource "aws_instance" "web" {
        ami           = "ami-123"
        instance_type = "t3.micro"
      }
    expected:
      violations:
        - rule: terraform.tag-required
          message_contains: "aws_instance.web"
  - name: aws resource with tags map passes
    input: |
      resource "aws_instance" "web" {
        ami  = "ami-123"
        tags = {
          Name = "web"
          Env  = "prod"
        }
      }
    expected:
      violations: []
  - name: non-aws resource is exempt
    input: |
      resource "google_compute_instance" "x" {
        name = "x"
      }
    expected:
      violations: []
  - name: multiple aws resources, only untagged one fires
    input: |
      resource "aws_s3_bucket" "tagged" {
        bucket = "x"
        tags   = { Name = "x" }
      }
      resource "aws_s3_bucket" "untagged" {
        bucket = "y"
      }
    expected:
      violations:
        - rule: terraform.tag-required
          message_contains: "aws_s3_bucket.untagged"
