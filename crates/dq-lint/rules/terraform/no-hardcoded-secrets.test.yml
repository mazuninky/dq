tests:
  - name: hard-coded password literal fires
    input: |
      resource "aws_db_instance" "default" {
        name     = "mydb"
        password = "supersecret123"
      }
    expected:
      violations:
        - rule: terraform.no-hardcoded-secrets
          message_contains: "password"
  - name: variable reference for password is allowed
    input: |
      resource "aws_db_instance" "default" {
        name     = "mydb"
        password = var.db_password
      }
    expected:
      violations: []
  - name: data source reference for api_key is allowed
    input: |
      resource "example" "x" {
        api_key = data.aws_secretsmanager_secret_version.api.secret_string
      }
    expected:
      violations: []
  - name: empty literal does not fire
    input: |
      resource "example" "x" {
        token = ""
      }
    expected:
      violations: []
  - name: non-secret keys ignored
    input: |
      resource "example" "x" {
        name        = "production"
        description = "this is a long description"
      }
    expected:
      violations: []
