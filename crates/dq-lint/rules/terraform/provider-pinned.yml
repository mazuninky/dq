id: terraform.provider-pinned
description: |
  Every provider used by a module needs a version constraint so
  `terraform init` installs the same provider version across machines
  and CI runs. Modern Terraform (≥ 0.13) declares constraints in
  `terraform { required_providers { <name> = { version = "..." } } }`;
  legacy `provider "<name>" { version = "..." }` is also accepted but
  deprecated. This rule flags providers that have no version constraint
  in either location. Pin a `~> X.Y` range or an exact `X.Y.Z` version.
severity: warn
match:
  format: hcl
check:
  # Walk every provider block whose own `version` argument is unset and
  # whose name is also missing from terraform.required_providers (or has
  # no `version` field there). Either location satisfies the rule.
  jq: |
    . as $root |
    [.provider // {} | to_entries[]
      | select(.value.version == null)
      | select(
          (($root.terraform // {}).required_providers // {}) as $req
          | ($req[.key]? | type) != "object"
            or (($req[.key]?.version // null) == null))
      | {name: .key}][]
  message: "Provider '{{ .name }}' has no version constraint (set it on the provider block or in terraform.required_providers)"
references:
  - https://developer.hashicorp.com/terraform/language/providers/requirements
