id: terraform.no-hardcoded-secrets
description: |
  Hard-coding passwords, API keys, or secret tokens as literal strings in
  Terraform configuration leaks credentials into version control. Use
  variables (`var.*`), data sources (`data.aws_secretsmanager_secret.*`),
  or environment lookups instead. The HCL parser surfaces variable and
  data-source references as `${...}` template strings, so this rule
  matches only bare string literals — references are silently allowed.
severity: error
match:
  format: hcl
check:
  jq: |
    [.. | objects | to_entries[]?
      | select(.key | tostring | test("(?i)^(password|secret|api_key|apikey|access_key|secret_key|token|private_key)$"))
      | select(.value | type == "string")
      | select(.value | startswith("${") | not)
      | select(.value | length > 0)
      | {key: .key, value: .value}][]
  message: "Hard-coded secret literal in '{{ .key }}' — replace with var.* or data.* reference"
references:
  - https://developer.hashicorp.com/terraform/language/values/variables
  - https://developer.hashicorp.com/terraform/language/state/sensitive-data
