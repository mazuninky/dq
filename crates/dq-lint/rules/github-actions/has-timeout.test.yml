tests:
  - name: job without timeout fires
    input: |
      name: ci
      on: [push]
      jobs:
        build:
          runs-on: ubuntu-latest
          steps: [{ uses: actions/checkout@v4 }]
    expected:
      violations:
        - rule: github-actions.has-timeout
          message_contains: "build"
  - name: job with timeout-minutes passes
    input: |
      name: ci
      on: [push]
      jobs:
        build:
          runs-on: ubuntu-latest
          timeout-minutes: 15
          steps: [{ uses: actions/checkout@v4 }]
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
  - name: jobs as a list is not a workflow
    input: |
      on: [push]
      jobs: [build, test]
    expected:
      violations: []
  - name: jobs as a string is not a workflow
    input: |
      on: [push]
      jobs: build
    expected:
      violations: []
  - name: scalar job is skipped
    input: |
      on: [push]
      jobs:
        a: x
        b: {runs-on: ubuntu-latest}
    expected:
      violations:
        - rule: github-actions.has-timeout
          message_contains: "'b'"
  - name: CircleCI config (version + jobs, no on) is not a workflow
    input: |
      version: 2.1
      jobs:
        build:
          docker:
            - image: cimg/base:stable
          steps:
            - checkout
            - uses: owner/repo@v1
            - run: echo hi
      workflows:
        main:
          jobs: [build]
    expected:
      violations: []
