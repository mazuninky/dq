  - name: format() building refs/pull/ merge fires
    input: |
      name: ci
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ format('refs/pull/{0}/merge', github.event.number) }}
    expected:
      violations:
        - rule: github-actions.no-pull-request-target-with-checkout
  - name: format() building refs/pull/ head with pull_request.number fires
    input: |
      name: ci
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
