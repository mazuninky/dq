  - name: pull_request.head.repo.full_name in repository fires
    input: |
      name: ci
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                repository: ${{ github.event.pull_request.head.repo.full_name }}
    expected:
      violations:
        - rule: github-actions.no-pull-request-target-with-checkout
  - name: head repository with a base ref still fires
    input: |
      name: ci
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                ref: main
                repository: ${{ github.event.pull_request.head.repo.full_name }}
    expected:
      violations:
        - rule: github-actions.no-pull-request-target-with-checkout
  - name: bracket-notation head sha fires
    input: |
      name: ci
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event['pull_request']['head']['sha'] }}
    expected:
