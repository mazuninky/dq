                ref: refs/pull/${{ github.event.number }}/merge
    expected:
      violations:
        - rule: github-actions.no-pull-request-target-with-checkout
  - name: refs/pull/ with pull_request.number head fires
    input: |
      name: ci
      on: pull_request_target
      jobs:
        build:
          runs-on: ubuntu-latest
