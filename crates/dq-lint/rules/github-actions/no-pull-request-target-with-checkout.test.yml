                ref: ${{ format('refs/pull/{0}/head', github.event.pull_request.number) }}
    expected:
      violations:
        - rule: github-actions.no-pull-request-target-with-checkout
  - name: format() in a double-quoted scalar fires
    input: |
      name: ci
