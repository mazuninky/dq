id: github-actions.no-pull-request-target-with-checkout
description: |
  Workflows triggered on `pull_request_target` run with elevated
  privileges and access to repository secrets. Checking out the PR's
  HEAD ref in such a workflow lets a malicious PR run arbitrary code
  with full repo write access — a documented supply-chain attack.
severity: error
match:
  format: yaml
  # Every workflow has `on:` (a reusable one has `on: workflow_call`);
  # without it a CircleCI `config.yml` (`version` + `jobs:`) would match.
  filter: 'type == "object" and has("on") and has("jobs") and (.jobs | . == null or type == "object")'
check:
  # `ref:` / `repository:` of the checkout name the PR head in any of these
  # spellings: `github.head_ref`, `github.event.pull_request.head.*` (also the
  # merge commit), `refs/pull/<n>/{merge,head}` (literal, or built with
  # `format()`). Bracket access (`github.event['pull_request']`) is folded to
  # dotted form first; context names are case-insensitive in expressions.
  # `on:` names its events as a string, a list or a mapping keyed by event.
  jq: 'select(.on | (if type == "string" then [.] elif type == "array" then . elif type == "object" then keys else [] end) | any(. == "pull_request_target")) | (.jobs // {})[] | objects | (.steps // []) | arrays | .[] | objects | select((.uses // "") | tostring | test("^actions/checkout@")) | select([.with.ref?, .with.repository?] | map((. // "") | tostring | gsub("\\[\\s*[\u0027\"](?<k>[^\u0027\"\\]]+)[\u0027\"]\\s*\\]"; "." + .k) | test("github\\.head_ref|github\\.event\\.pull_request\\.(head|merge_commit_sha)|head\\.(sha|ref)|refs/pull/"; "i")) | any)'
  message: "Workflow uses pull_request_target AND checks out untrusted PR ref — security risk"
references:
  - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
