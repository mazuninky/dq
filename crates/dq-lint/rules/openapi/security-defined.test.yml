tests:
  - name: top-level security applies, all operations pass
    input: |
      openapi: "3.1.0"
      info: { title: API, version: "1.0.0" }
      security:
        - bearerAuth: []
      paths:
        /users:
          get:
            responses: { "200": { description: ok } }
    expected:
      violations: []
  - name: per-operation security passes
    input: |
      openapi: "3.1.0"
      info: { title: API, version: "1.0.0" }
      paths:
        /users:
          get:
            security:
              - bearerAuth: []
            responses: { "200": { description: ok } }
    expected:
      violations: []
  - name: no security at all fires
    input: |
      openapi: "3.1.0"
      info: { title: API, version: "1.0.0" }
      paths:
        /users:
          get:
            responses: { "200": { description: ok } }
    expected:
      violations:
        - rule: openapi.security-defined
          message_contains: "GET /users"
  - name: per-operation explicit empty security opts out
    input: |
      openapi: "3.1.0"
      info: { title: API, version: "1.0.0" }
      paths:
        /healthz:
          get:
            security: []
            responses: { "200": { description: ok } }
    expected:
      violations: []
  - name: mixed coverage fires for the unsecured operation
    input: |
      openapi: "3.1.0"
      info: { title: API, version: "1.0.0" }
      paths:
        /a:
          get:
            security:
              - bearerAuth: []
            responses: { "200": { description: ok } }
        /b:
          get:
            responses: { "200": { description: ok } }
    expected:
      violations:
        - rule: openapi.security-defined
          message_contains: "GET /b"
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
  - name: scalar path item and scalar operation are skipped
    input: |
      openapi: "3.0.0"
      info: {title: t, version: "1"}
      paths:
        /a: x
        /b: {get: x}
        /c: {get: {responses: {"200": {}}}}
    expected:
      violations:
        - rule: openapi.security-defined
          message_contains: "GET /c"
