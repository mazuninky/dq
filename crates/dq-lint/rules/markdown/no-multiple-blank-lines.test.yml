tests:
  - name: single blank line passes
    input: |
      First paragraph.

      Second paragraph.
    expected:
      violations: []
  - name: tight document passes
    input: |
      # Title

      ## Section

      Body.
    expected:
      violations: []
  - name: link reference definition after one blank line passes
    input: |
      # Title

      [ref]: http://r
      See [here](x).
    expected:
      violations: []
  - name: two blank lines above a link reference definition fire
    input: |
      # Title


      [ref]: http://r
      See [here](x).
    expected:
      violations:
        - rule: markdown.no-multiple-blank-lines
          message_contains: "(2 blank lines)"
          line: 4
