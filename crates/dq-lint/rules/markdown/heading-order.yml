id: markdown.heading-order
description: |
  Heading levels should not skip — going from H1 directly to H3 makes
  the document outline harder to read and breaks accessibility tooling.
  Increase one level at a time.
severity: error
match:
  format: markdown
check:
  jq: |
    [.children[]? | select(.type == "heading")] as $hs
    | range(1; $hs | length) as $i
    | $hs[$i-1] as $prev
    | $hs[$i] as $cur
    | select($cur.level > $prev.level + 1)
    | { previous: $prev.level, current: $cur.level, position: $cur.position }
  message: "Heading level jumps from H{{ .previous }} to H{{ .current }} (skipped at least one level)"
references:
  - https://www.w3.org/WAI/tutorials/page-structure/headings/
loc:
  line: '.position.start.line // 1'
