id: markdown.no-empty-headings
description: |
  Every heading should contain non-empty inline text. Empty headings
  break navigation, confuse screen readers, and usually indicate an
  incomplete edit.
severity: error
match:
  format: markdown
check:
  jq: |
    .children[]?
    | select(.type == "heading")
    | . as $h
    | ([$h | recurse(.children?[]?) | select(.type == "text") | .value] | join("") | gsub("^\\s+|\\s+$"; ""))
    | select(. == "")
    | { level: $h.level, position: $h.position }
  message: "Heading at H{{ .level }} has empty text"
references:
  - https://www.w3.org/WAI/tutorials/page-structure/headings/
loc:
  line: '.position.start.line // 1'
