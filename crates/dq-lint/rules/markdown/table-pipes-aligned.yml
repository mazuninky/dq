id: markdown.table-pipes-aligned
description: |
  Every row in a GFM table should have the same number of cells. Mismatched
  cell counts often indicate a missing pipe character and produce broken
  table rendering.
severity: warn
match:
  format: markdown
check:
  jq: |
    [.. | objects | select(.type? == "table")][]
    | . as $t
    | ($t.children? | arrays) as $rows
    | ($rows[0] | objects | .children? | arrays | length) as $expected
    | $rows[1:][]
    | objects
    | (.children? | arrays | length) as $actual
    | select($actual != $expected)
    | { expected: $expected, actual: $actual, position: .position }
  message: "Table row has {{ .actual }} cells but header row has {{ .expected }}"
references:
  - https://github.github.com/gfm/#tables-extension-
loc:
  line: '(objects | .position | objects | .start | objects | .line) // 1'
