id: markdown.code-block-fenced
description: |
  Prefer fenced code blocks (triple backtick or tilde) over indented
  code blocks. Fenced blocks support language hints, are easier to
  copy, and degrade more gracefully when nested inside lists.
severity: info
match:
  format: markdown
check:
  jq: |
    .children[]?
    | select(.type == "code_block" and (.fenced // false) == false)
    | { position: .position }
  message: "Indented code block; prefer fenced syntax (```lang or ~~~lang)"
references:
  - https://commonmark.org/help/
loc:
  line: '.position.start.line // 1'
