id: markdown.single-h1
description: |
  A markdown document should have exactly one top-level (H1) heading.
  Multiple H1s break document outlines and confuse static-site
  generators that auto-derive the page title from the first H1.
severity: error
match:
  format: markdown
check:
  jq: |
    [.children[]? | select(.type == "heading" and .level == 1)] as $h1s
    | select(($h1s | length) > 1)
    | $h1s[1:][] | { position: .position }
  message: "Document contains more than one H1 heading; use H2 for subsequent sections"
references:
  - https://www.w3.org/WAI/tutorials/page-structure/headings/
loc:
  line: '.position.start.line // 1'
