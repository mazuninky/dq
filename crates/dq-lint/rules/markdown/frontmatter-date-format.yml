id: markdown.frontmatter-date-format
description: |
  When a `date` field is present in frontmatter it should be a string
  matching ISO 8601 / RFC 3339 (YYYY-MM-DD or full timestamp). Loose
  date strings break sorting and timezone-aware tooling.
severity: warn
match:
  format: markdown
  filter: '.frontmatter != null and (.frontmatter.value.date // null) != null'
check:
  jq: |
    (.frontmatter.value.date | tostring) as $d
    | select(($d | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?)?$")) | not)
    | { date: $d }
  message: "Frontmatter `date` value '{{ .date }}' does not match ISO 8601 / RFC 3339"
references:
  - https://datatracker.ietf.org/doc/html/rfc3339
loc:
  line: 1
