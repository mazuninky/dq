tests:
  - name: complete frontmatter passes
    input: |
      ---
      name: my-skill
      description: >
        Guide for using the skill. Trigger this skill whenever the user
        mentions related topics.
      ---

      # Body

      Body text.
    format: markdown
    expected:
      violations: []

  - name: minimal frontmatter with only name passes
    # `description` is optional per spec — falls back to first markdown paragraph
    input: |
      ---
      name: my-skill
      ---

      First paragraph acts as the implicit description per the skill spec.
    format: markdown
    expected:
      violations: []

  - name: minimal frontmatter with only description passes
    # `name` is optional per spec — falls back to skill directory name
    input: |
      ---
      description: Skill description goes here.
      ---

      # Body
    format: markdown
    expected:
      violations: []

  - name: no frontmatter does not fire
    input: |
      # Just a reference doc

      No frontmatter here.
    format: markdown
    expected:
      violations: []

  - name: name with underscore fires
    # Spec allows only `[a-z0-9-]`; underscore is rejected by the loader.
    input: |
      ---
      name: my_skill
      description: A skill.
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "`name` must match"

  - name: name with uppercase fires
    input: |
      ---
      name: MySkill
      description: A skill.
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "`name` must match"

  - name: name exceeding 64 chars fires
    # 65 chars; regex still matches but length cap is breached.
    input: |
      ---
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      description: A skill.
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "exceeds 64"

  - name: oversized description fires
    # 1,700 chars (single field) > 1,536 cap.
    input: |
      ---
      name: my-skill
      description: ""
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "exceeds 1,536"

  - name: description plus when_to_use combined over 1,536 fires
    # Each 900 chars; combined 1,800 > 1,536. Neither alone trips the cap.
    input: |
      ---
      name: my-skill
      description: ""
      when_to_use: ""
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "exceeds 1,536"
