tests:
  - name: complete frontmatter passes
    input: |
      ---
      name: my-skill
      description: >
        Guide for using the skill. Trigger this skill whenever the user
        mentions related topics.
      ---

      # Body

      Body text.
    format: markdown
    expected:
      violations: []

  - name: missing description fires
    input: |
      ---
      name: my-skill
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "missing required field `description`"

  - name: missing name fires
    input: |
      ---
      description: A skill.
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "missing required field `name`"

  - name: invalid name pattern fires
    input: |
      ---
      name: BadName!
      description: A skill.
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "`name` must match"

  - name: oversized description fires
    # 1500 chars > 1024 cap; quoted scalar avoids YAML folded-block parser quirks
    input: |
      ---
      name: my-skill
      description: ""
      ---

      # Body
    format: markdown
    expected:
      violations:
        - rule: skills.frontmatter
          message_contains: "exceeds 1024"

  - name: no frontmatter does not fire
    input: |
      # Just a reference doc

      No frontmatter here.
    format: markdown
    expected:
      violations: []
