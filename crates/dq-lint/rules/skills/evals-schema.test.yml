tests:
  - name: well-formed evals.json passes
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "do the thing",
            "expected_output": "Uses tool foo ...",
            "assertions": [
              { "text": "uses -F toon", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations: []

  - name: an eval's name or eval_name label passes
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "name": "bump-replicas",
            "prompt": "do the thing",
            "expected_output": "Uses tool foo ...",
            "assertions": [
              { "text": "uses -F toon", "type": "output" }
            ]
          },
          {
            "id": 2,
            "eval_name": "Empty input!",
            "prompt": "do the other thing",
            "expected_output": "Uses tool bar ...",
            "assertions": [
              { "text": "uses -F json", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations: []

  - name: a non-string name fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "name": 7,
            "prompt": "x",
            "expected_output": "y",
            "assertions": [
              { "text": "z", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "not of type"

  - name: missing expected_output fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "assertions": [
              { "text": "y", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "expected_output"

  - name: empty assertions array fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "expected_output": "y",
            "assertions": []
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "less than 1 item"

  - name: bogus assertion type fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "expected_output": "y",
            "assertions": [
              { "text": "z", "type": "wat" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema

  - name: skill-creator's expectations strings pass
    input: |
      {
        "skill_name": "example-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "User's example prompt",
            "expected_output": "Description of expected result",
            "files": ["evals/files/sample1.pdf"],
            "expectations": [
              "The output includes X",
              "The skill used script Y"
            ]
          }
        ]
      }
    format: json
    expected:
      violations: []

  - name: assertions as strings pass, as skill-creator reads them
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "expected_output": "y",
            "assertions": ["The output includes X"]
          }
        ]
      }
    format: json
    expected:
      violations: []

  - name: an eval with neither expectations nor assertions fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          { "id": 1, "prompt": "x", "expected_output": "y" }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema

  - name: empty expectations fire
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          { "id": 1, "prompt": "x", "expected_output": "y", "expectations": [] }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "less than 1 item"

  - name: an expectation that is no string fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "expected_output": "y",
            "expectations": [{ "text": "z", "type": "output" }]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "not of type"

  - name: unrelated json file does not fire
    input: |
      { "name": "package", "version": "1.0.0" }
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
