tests:
  - name: well-formed evals.json passes
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "do the thing",
            "expected_output": "Uses tool foo ...",
            "assertions": [
              { "text": "uses -F toon", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations: []

  - name: an eval's name or eval_name label passes
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "name": "bump-replicas",
            "prompt": "do the thing",
            "expected_output": "Uses tool foo ...",
            "assertions": [
              { "text": "uses -F toon", "type": "output" }
            ]
          },
          {
            "id": 2,
            "eval_name": "Empty input!",
            "prompt": "do the other thing",
            "expected_output": "Uses tool bar ...",
            "assertions": [
              { "text": "uses -F json", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations: []

  - name: a non-string name fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "name": 7,
            "prompt": "x",
            "expected_output": "y",
            "assertions": [
              { "text": "z", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "not of type"

  - name: missing expected_output fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "assertions": [
              { "text": "y", "type": "output" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "expected_output"

  - name: empty assertions array fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "expected_output": "y",
            "assertions": []
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema
          message_contains: "less than 1 item"

  - name: bogus assertion type fires
    input: |
      {
        "skill_name": "my-skill",
        "evals": [
          {
            "id": 1,
            "prompt": "x",
            "expected_output": "y",
            "assertions": [
              { "text": "z", "type": "wat" }
            ]
          }
        ]
      }
    format: json
    expected:
      violations:
        - rule: skills.evals-schema

  - name: unrelated json file does not fire
    input: |
      { "name": "package", "version": "1.0.0" }
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
