tests:
  - name: pinned tag with Always fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1.2.3
                imagePullPolicy: Always
    expected:
      violations:
        - rule: k8s.image-pull-policy-always
  - name: latest tag with Always passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:latest
                imagePullPolicy: Always
    expected:
      violations: []
  - name: pinned tag with IfNotPresent passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1.2.3
                imagePullPolicy: IfNotPresent
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
