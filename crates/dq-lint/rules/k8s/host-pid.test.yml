tests:
  - name: pod with hostPID fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            hostPID: true
            containers:
              - name: app
                image: app:v1
    expected:
      violations:
        - rule: k8s.host-pid
  - name: pod without hostPID passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
  - name: a string spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec: x
    expected:
      violations: []
  - name: a string template produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template: x
    expected:
      violations: []
  - name: a number template spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec: 1
    expected:
      violations: []
