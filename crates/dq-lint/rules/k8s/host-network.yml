id: k8s.host-network
description: |
  Pods should not request host network access. hostNetwork=true gives
  the pod the node's network namespace and bypasses NetworkPolicy
  isolation, drastically expanding the blast radius of a compromise.
severity: error
match:
  format: yaml
  filter: 'type == "object" and (.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod")'
check:
  jq: |
    # The pod spec of a workload (`.spec.template.spec`) or of a Pod
    # (`.spec`). Any step whose value has the wrong type (a string `spec`, a
    # `template` that is not a map) yields nothing instead of raising.
    def pod:
      (.spec // {} | objects) as $s
      | if ($s.template // null) != null
        then ($s.template | objects | .spec // {} | objects) as $p
             | {spec: $p, ptr: "/spec/template/spec"}
        else {spec: $s, ptr: "/spec"}
        end;
    pod
    | select(.spec.hostNetwork == true)
    | { pointer: (.ptr + "/hostNetwork") }
  message: "Pod uses hostNetwork: true"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
