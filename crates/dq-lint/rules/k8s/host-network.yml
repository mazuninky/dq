id: k8s.host-network
description: |
  Pods should not request host network access. hostNetwork=true gives
  the pod the node's network namespace and bypasses NetworkPolicy
  isolation, drastically expanding the blast radius of a compromise.
severity: error
match:
  format: yaml
  filter: '.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod"'
check:
  jq: |
    if (.spec.template // null) != null
    then { spec: .spec.template.spec, ptr: "/spec/template/spec" }
    else { spec: .spec,               ptr: "/spec" }
    end
    | select(.spec.hostNetwork == true)
    | { pointer: (.ptr + "/hostNetwork") }
  message: "Pod uses hostNetwork: true"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
