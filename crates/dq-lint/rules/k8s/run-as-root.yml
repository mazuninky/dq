id: k8s.run-as-root
description: |
  Pods should explicitly declare runAsNonRoot=true so they cannot
  accidentally run as UID 0. The Pod Security Standards "restricted"
  profile requires this; missing the field means the kubelet falls back
  to the image's default user, which is often root.
severity: warn
match:
  format: yaml
  filter: 'type == "object" and (.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod")'
check:
  jq: |
    # A step whose value has the wrong type (a string `spec`, `metadata` or
    # `securityContext`) yields nothing instead of raising; a missing one
    # reads as empty.
    . as $doc
    | (.spec // {} | objects) as $s
    | if ($s.template // null) != null
      then ($s.template | objects | .spec // {} | objects) as $p
           | {spec: $p, ptr: "/spec/template/spec"}
      else {spec: $s, ptr: "/spec"}
      end
    | . as $ctx
    | select(($ctx.spec.securityContext // {} | objects | .runAsNonRoot // null) != true)
    | { kind: "pod",
        name: (($doc.metadata // {} | objects | .name) // "<unnamed>"),
        pointer: ($ctx.ptr + "/containers/0/name") }
  message: "Pod-spec '{{ .name }}' does not set securityContext.runAsNonRoot=true"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
