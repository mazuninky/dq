id: k8s.missing-resources-limits
description: |
  Containers should declare CPU and memory resource limits so the
  scheduler can pack pods reliably and the kubelet can apply OOM
  protections. Missing limits let a noisy neighbour starve other
  workloads on the node.
severity: warn
match:
  format: yaml
  filter: 'type == "object" and (.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod")'
check:
  jq: |
    # The pod spec of a workload (`.spec.template.spec`) or of a Pod
    # (`.spec`); `containers` streams its container objects. Any step
    # whose value has the wrong type (a string `spec`, a `containers`
    # that is not an array, a container that is not a map) yields nothing
    # instead of raising.
    def pod:
      (.spec // {} | objects) as $s
      | if ($s.template // null) != null
        then ($s.template | objects | .spec // {} | objects) as $p
             | {spec: $p, ptr: "/spec/template/spec"}
        else {spec: $s, ptr: "/spec"}
        end;
    def containers:
      pod | .ptr as $ptr
      | (.spec.containers // [] | arrays | to_entries[])
      | select(.value | type == "object")
      | {c: .value, at: ($ptr + "/containers/" + (.key | tostring))};
    containers
    | (.c.resources // {} | objects | .limits // {} | objects) as $limits
    | select(($limits.cpu // null) == null or ($limits.memory // null) == null)
    | { name: .c.name, pointer: (.at + "/name") }
  message: "Container '{{ .name }}' is missing resources.limits (cpu and/or memory)"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
