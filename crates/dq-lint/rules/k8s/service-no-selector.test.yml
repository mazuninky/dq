tests:
  - name: service without selector fires
    input: |
      apiVersion: v1
      kind: Service
      metadata: { name: api }
      spec:
        ports: [{ port: 80 }]
    expected:
      violations:
        - rule: k8s.service-no-selector
  - name: service with selector passes
    input: |
      apiVersion: v1
      kind: Service
      metadata: { name: api }
      spec:
        selector: { app: api }
        ports: [{ port: 80 }]
    expected:
      violations: []
  - name: ExternalName service is exempt
    input: |
      apiVersion: v1
      kind: Service
      metadata: { name: external }
      spec:
        type: ExternalName
        externalName: example.com
    expected:
      violations: []
