tests:
  - name: container without explicit allowPrivilegeEscalation=false fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1
    expected:
      violations:
        - rule: k8s.allow-privilege-escalation
  - name: container with allowPrivilegeEscalation=false passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1
                securityContext:
                  allowPrivilegeEscalation: false
    expected:
      violations: []
