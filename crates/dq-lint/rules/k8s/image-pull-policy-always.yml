id: k8s.image-pull-policy-always
description: |
  Containers using imagePullPolicy=Always force the kubelet to contact
  the registry on every pod start. For pinned (non-:latest) tags this
  wastes bandwidth and latency without buying anything. Prefer
  IfNotPresent for pinned tags; Always is appropriate only for :latest.
severity: info
match:
  format: yaml
  filter: 'type == "object" and (.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod")'
check:
  # Phase 2 of `add-ir-foundation`: emit `{name, image, pointer}` per
  # offending container so `loc.pointer` resolves to the exact
  # `(line, col)` in the source bytes. The pointer prefix differs
  # between Pod-shaped (`/spec/containers/<idx>`) and workload-shaped
  # (`/spec/template/spec/containers/<idx>`) inputs — `pod` picks the
  # right one.
  jq: |
    # The pod spec of a workload (`.spec.template.spec`) or of a Pod
    # (`.spec`); `containers` streams its container objects. Any step
    # whose value has the wrong type (a string `spec`, a `containers`
    # that is not an array, a container that is not a map) yields nothing
    # instead of raising.
    def pod:
      (.spec // {} | objects) as $s
      | if ($s.template // null) != null
        then ($s.template | objects | .spec // {} | objects) as $p
             | {spec: $p, ptr: "/spec/template/spec"}
        else {spec: $s, ptr: "/spec"}
        end;
    def containers:
      pod | .ptr as $ptr
      | (.spec.containers // [] | arrays | to_entries[])
      | select(.value | type == "object")
      | {c: .value, at: ($ptr + "/containers/" + (.key | tostring))};
    containers
    | select(.c.imagePullPolicy == "Always"
             and (.c.image | tostring | test(":latest$") | not))
    | { name: .c.name, image: .c.image, pointer: (.at + "/name") }
  message: "Container '{{ .name }}' uses imagePullPolicy=Always with a pinned tag"
loc:
  pointer: '.pointer'
fix:
  # Walk every node; on container-shaped objects with the offending
  # combination, swap `imagePullPolicy: Always` for `IfNotPresent`. The
  # fix is idempotent: after the rewrite the predicate
  # `.imagePullPolicy == "Always"` no longer holds on those containers,
  # so a second application is a no-op.
  jq: 'walk(if type == "object" and .imagePullPolicy == "Always" and (.image // "" | tostring | test(":latest$") | not) then .imagePullPolicy = "IfNotPresent" else . end)'
references:
  - https://kubernetes.io/docs/concepts/containers/images/#updating-images
