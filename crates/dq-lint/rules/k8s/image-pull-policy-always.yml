id: k8s.image-pull-policy-always
description: |
  Containers using imagePullPolicy=Always force the kubelet to contact
  the registry on every pod start. For pinned (non-:latest) tags this
  wastes bandwidth and latency without buying anything. Prefer
  IfNotPresent for pinned tags; Always is appropriate only for :latest.
severity: info
match:
  format: yaml
  filter: '.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod"'
check:
  jq: '(.spec.template.spec.containers // .spec.containers // [])[] | select(.imagePullPolicy == "Always" and (.image | tostring | test(":latest$") | not))'
  message: "Container '{{ .name }}' uses imagePullPolicy=Always with a pinned tag"
fix:
  # Walk every node; on container-shaped objects with the offending
  # combination, swap `imagePullPolicy: Always` for `IfNotPresent`. The
  # fix is idempotent: after the rewrite the predicate
  # `.imagePullPolicy == "Always"` no longer holds on those containers,
  # so a second application is a no-op.
  jq: 'walk(if type == "object" and .imagePullPolicy == "Always" and (.image // "" | tostring | test(":latest$") | not) then .imagePullPolicy = "IfNotPresent" else . end)'
references:
  - https://kubernetes.io/docs/concepts/containers/images/#updating-images
