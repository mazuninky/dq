tests:
  - name: deployment with :latest fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: app
                image: my-app:latest
    expected:
      violations:
        - rule: k8s.no-latest-tag
          message_contains: "uses :latest"
  - name: deployment with pinned tag passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: app
                image: my-app:v1.2.3
    expected:
      violations: []
  - name: service is not matched
    input: |
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      spec:
        selector: { app: app }
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
  - name: a string spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec: x
    expected:
      violations: []
  - name: a string template produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template: x
    expected:
      violations: []
  - name: a number template spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec: 1
    expected:
      violations: []
  - name: a string containers field produces no violations
    input: |
      apiVersion: v1
      kind: Pod
      spec:
        containers: x
    expected:
      violations: []
  - name: containers that are not maps produce no violations
    input: |
      apiVersion: v1
      kind: Pod
      spec:
        containers: [x, 1, null, [a]]
    expected:
      violations: []
