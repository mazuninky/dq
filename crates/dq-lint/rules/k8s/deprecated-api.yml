id: k8s.deprecated-api
description: |
  Manifest uses an apiVersion that has been removed in modern
  Kubernetes (1.22+). Resources still referenced under deprecated
  group/versions will fail to apply.
severity: error
match:
  format: yaml
  filter: 'has("apiVersion")'
check:
  jq: 'select(.apiVersion as $av | $av == "extensions/v1beta1" or $av == "apps/v1beta1" or $av == "apps/v1beta2" or $av == "policy/v1beta1") | {api: .apiVersion, kind: (.kind // "<unknown>"), pointer: "/apiVersion"}'
  message: "Resource of kind '{{ .kind }}' uses deprecated apiVersion '{{ .api }}'"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/reference/using-api/deprecation-guide/
