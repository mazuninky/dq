id: k8s.hostpath-volume
description: |
  Pods should not mount hostPath volumes in production. hostPath
  exposes the node's filesystem to the container, breaks portability
  between nodes, and is a common privilege-escalation vector.
severity: warn
match:
  format: yaml
  filter: 'type == "object" and (.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod")'
check:
  jq: |
    # The pod spec of a workload (`.spec.template.spec`) or of a Pod
    # (`.spec`). Any step whose value has the wrong type (a string `spec`, a
    # `template` that is not a map, a `volumes` that is not an array) yields
    # nothing instead of raising.
    def pod:
      (.spec // {} | objects) as $s
      | if ($s.template // null) != null
        then ($s.template | objects | .spec // {} | objects) as $p
             | {spec: $p, ptr: "/spec/template/spec"}
        else {spec: $s, ptr: "/spec"}
        end;
    pod | .ptr as $ptr
    | (.spec.volumes // [] | arrays | to_entries[])
    | select(.value | type == "object")
    | select(.value.hostPath != null)
    | { name: .value.name,
        pointer: ($ptr + "/volumes/" + (.key | tostring) + "/hostPath") }
  message: "Volume '{{ .name }}' is a hostPath volume"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
