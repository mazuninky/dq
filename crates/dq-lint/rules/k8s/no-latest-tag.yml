id: k8s.no-latest-tag
description: |
  Containers should not use the :latest image tag because it makes
  rollbacks impossible and ties production deployments to a mutable
  reference. Pin to an immutable tag or digest instead.
severity: error
match:
  format: yaml
  filter: '.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod"'
check:
  jq: |
    if (.spec.template // null) != null
    then
      (.spec.template.spec.containers // [])
      | to_entries[]
      | select(.value.image | tostring | test(":latest$") or (test(":") | not))
      | { name: .value.name,
          image: .value.image,
          pointer: ("/spec/template/spec/containers/" + (.key | tostring) + "/image") }
    else
      (.spec.containers // [])
      | to_entries[]
      | select(.value.image | tostring | test(":latest$") or (test(":") | not))
      | { name: .value.name,
          image: .value.image,
          pointer: ("/spec/containers/" + (.key | tostring) + "/image") }
    end
  message: "Container '{{ .name }}' uses :latest tag (image: {{ .image }})"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/containers/images/#image-names
