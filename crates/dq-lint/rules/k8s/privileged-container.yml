id: k8s.privileged-container
description: |
  Containers must not run as privileged. securityContext.privileged=true
  disables almost every Linux containment feature and is equivalent to
  running root on the host node.
severity: error
match:
  format: yaml
  filter: '.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod"'
check:
  jq: |
    if (.spec.template // null) != null
    then
      (.spec.template.spec.containers // [])
      | to_entries[]
      | select(.value.securityContext.privileged == true)
      | { name: .value.name,
          pointer: ("/spec/template/spec/containers/" + (.key | tostring) + "/securityContext/privileged") }
    else
      (.spec.containers // [])
      | to_entries[]
      | select(.value.securityContext.privileged == true)
      | { name: .value.name,
          pointer: ("/spec/containers/" + (.key | tostring) + "/securityContext/privileged") }
    end
  message: "Container '{{ .name }}' runs as privileged"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
