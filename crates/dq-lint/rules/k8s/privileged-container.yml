id: k8s.privileged-container
description: |
  Containers must not run as privileged. securityContext.privileged=true
  disables almost every Linux containment feature and is equivalent to
  running root on the host node.
severity: error
match:
  format: yaml
  filter: 'type == "object" and (.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Pod")'
check:
  jq: |
    # The pod spec of a workload (`.spec.template.spec`) or of a Pod
    # (`.spec`); `containers` streams its container objects. Any step
    # whose value has the wrong type (a string `spec`, a `containers`
    # that is not an array, a container that is not a map) yields nothing
    # instead of raising.
    def pod:
      (.spec // {} | objects) as $s
      | if ($s.template // null) != null
        then ($s.template | objects | .spec // {} | objects) as $p
             | {spec: $p, ptr: "/spec/template/spec"}
        else {spec: $s, ptr: "/spec"}
        end;
    def containers:
      pod | .ptr as $ptr
      | (.spec.containers // [] | arrays | to_entries[])
      | select(.value | type == "object")
      | {c: .value, at: ($ptr + "/containers/" + (.key | tostring))};
    containers
    | select((.c.securityContext // {} | objects | .privileged) == true)
    | { name: .c.name, pointer: (.at + "/securityContext/privileged") }
  message: "Container '{{ .name }}' runs as privileged"
loc:
  pointer: '.pointer'
references:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
