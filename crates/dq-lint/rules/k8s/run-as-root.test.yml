tests:
  - name: deployment without runAsNonRoot fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: app }
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1
    expected:
      violations:
        - rule: k8s.run-as-root
          message_contains: "runAsNonRoot"
  - name: deployment with runAsNonRoot=true passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: app }
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - name: app
                image: app:v1
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
  - name: a string spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec: x
    expected:
      violations: []
  - name: a string template produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template: x
    expected:
      violations: []
  - name: a string securityContext produces no violations
    input: |
      apiVersion: v1
      kind: Pod
      spec:
        securityContext: x
    expected:
      violations: []
  - name: string metadata still reports the pod, unnamed
    input: |
      apiVersion: v1
      kind: Pod
      metadata: x
      spec:
        containers:
          - name: app
    expected:
      violations:
        - rule: k8s.run-as-root
          message_contains: "<unnamed>"
