tests:
  - name: deployment without runAsNonRoot fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: app }
      spec:
        template:
          spec:
            containers:
              - name: app
                image: app:v1
    expected:
      violations:
        - rule: k8s.run-as-root
          message_contains: "runAsNonRoot"
  - name: deployment with runAsNonRoot=true passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: app }
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - name: app
                image: app:v1
    expected:
      violations: []
