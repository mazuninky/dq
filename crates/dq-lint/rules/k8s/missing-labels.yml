id: k8s.missing-labels
description: |
  Workloads should declare the recommended Kubernetes labels
  (`app.kubernetes.io/name`, `app.kubernetes.io/instance`) so kubectl
  selectors and dashboards can group resources by application.
severity: info
match:
  format: yaml
  filter: '.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Service" or .kind == "Job" or .kind == "CronJob"'
check:
  jq: 'select((.metadata.labels // {})["app.kubernetes.io/name"] == null) | {kind: .kind, name: (.metadata.name // "<unnamed>")}'
  message: "{{ .kind }} '{{ .name }}' is missing label app.kubernetes.io/name"
references:
  - https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/
