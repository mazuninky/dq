tests:
  - name: container without liveness probe fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: web
                image: web:v1
    expected:
      violations:
        - rule: k8s.missing-liveness-probe
          message_contains: "no livenessProbe"
  - name: container with liveness probe passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: web
                image: web:v1
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
    expected:
      violations: []
