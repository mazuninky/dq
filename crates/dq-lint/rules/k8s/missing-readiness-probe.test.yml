tests:
  - name: container without readiness probe fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: web
                image: web:v1
    expected:
      violations:
        - rule: k8s.missing-readiness-probe
          message_contains: "no readinessProbe"
  - name: container with readiness probe passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers:
              - name: web
                image: web:v1
                readinessProbe:
                  tcpSocket:
                    port: 8080
    expected:
      violations: []
