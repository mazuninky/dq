tests:
  - name: pod with hostPath volume fires
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers: [{ name: app, image: app:v1 }]
            volumes:
              - name: docker-sock
                hostPath: { path: /var/run/docker.sock }
    expected:
      violations:
        - rule: k8s.hostpath-volume
          message_contains: "hostPath"
  - name: pod with emptyDir passes
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec:
            containers: [{ name: app, image: app:v1 }]
            volumes:
              - name: cache
                emptyDir: {}
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      - a
      - b
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    expected:
      violations: []
  - name: a string spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec: x
    expected:
      violations: []
  - name: a string template produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template: x
    expected:
      violations: []
  - name: a number template spec produces no violations
    input: |
      apiVersion: apps/v1
      kind: Deployment
      spec:
        template:
          spec: 1
    expected:
      violations: []
  - name: a string volumes field produces no violations
    input: |
      apiVersion: v1
      kind: Pod
      spec:
        volumes: x
    expected:
      violations: []
  - name: volumes that are not maps produce no violations
    input: |
      apiVersion: v1
      kind: Pod
      spec:
        volumes: [x, 1, null]
    expected:
      violations: []
