tests:
  - name: values.yaml with valid image shape passes
    input: |
      image:
        repository: nginx
        tag: "1.25"
      replicas: 2
    format: yaml
    expected:
      violations: []
  - name: values.yaml with empty image.repository fails
    input: |
      image:
        repository: ""
        tag: "1.25"
    format: yaml
    expected:
      violations:
        - rule: jsonschema.helm-values-against-schema
  - name: list root produces no violations
    input: |
      - a
      - b
    format: yaml
    expected:
      violations: []
  - name: scalar root produces no violations
    input: |
      just a string
    format: yaml
    expected:
      violations: []
  - name: empty document produces no violations
    input: ""
    format: yaml
    expected:
      violations: []
