id: jsonschema.helm-values-against-schema
description: |
  Helm chart `values.yaml` must conform to the chart's `values.schema.json`.
  The bundled schema sidecar (`helm-values-template.schema.json`) ships a
  permissive demo shape so the test runner can exercise the rule end-to-end;
  in production, users override `check.schema_file` to point at their own
  per-chart schema. Add `glob: '**/values.yaml'` (or your chart-specific
  pattern) to limit the rule to actual values files when authoring a
  custom override.
severity: error
match:
  format: yaml
check:
  schema_file: ./helm-values-template.schema.json
references:
  - https://helm.sh/docs/topics/charts/#schema-files
