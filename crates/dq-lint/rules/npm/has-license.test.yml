tests:
  - name: missing license fires
    input: '{"name":"foo","version":"1.0.0"}'
    format: json
    expected:
      violations:
        - rule: npm.has-license
  - name: license MIT passes
    input: '{"name":"foo","version":"1.0.0","license":"MIT"}'
    format: json
    expected:
      violations: []
  - name: private package is exempt
    input: '{"name":"foo","version":"1.0.0","private":true}'
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
