id: npm.has-license
description: |
  Packages should declare a SPDX license identifier so consumers can
  evaluate redistribution rights at install time. Missing the field
  triggers npm's "UNLICENSED" warning and blocks publishing in some
  internal registries.
severity: warn
match:
  format: json
  filter: 'has("name") and has("version")'
check:
  jq: 'select((.private // false) != true and ((.license // "") == ""))'
  message: "package.json is missing the 'license' field"
fix:
  # Phase 4 (`add-ir-foundation`): migrated from `fix.jq` to `fix.ops`
  # so the autofix preserves comments and surrounding bytes — this is
  # the reference comment-preserving rule for the @std/* library.
  #
  # The patch is emitted only when `/license` already exists in the
  # document (with an empty-string value). The missing-field case
  # (no `license` key at all) is currently NOT covered because the
  # M2 `Document::set_at` baseline does not yet support mkdir-p
  # insertion of new keys (it returns `Error::Path { MissingKey }`).
  # Tracking: a follow-up change will land mkdir-p so the `add` branch
  # can take over the missing-field case; until then this rule is a
  # no-op for newly-created `package.json` files that omit `license`.
  #
  # The rule is idempotent: once `/license` is `"UNLICENSED"`, the
  # `if`-guard collapses to `else []` (the empty patch), so a second
  # application is a clean no-op.
  ops: |
    if (.private // false) != true and (has("license") and (.license // "") == "")
    then [{"op": "replace", "path": "/license", "value": "UNLICENSED"}]
    else []
    end
references:
  - https://docs.npmjs.com/cli/v10/configuring-npm/package-json#license
