tests:
  - name: missing engines.node fires
    input: '{"name":"foo","version":"1.0.0","license":"MIT"}'
    format: json
    expected:
      violations:
        - rule: npm.has-engines
  - name: with engines.node passes
    input: '{"name":"foo","version":"1.0.0","engines":{"node":">=18"}}'
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
  - name: engines as a string has no engines.node
    input: |
      {"name":"foo","version":"1.0.0","engines":">=18"}
    expected:
      violations:
        - rule: npm.has-engines
