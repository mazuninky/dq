tests:
  - name: rm -rf / fires
    input: '{"name":"foo","version":"1.0.0","scripts":{"clean":"rm -rf /"}}'
    format: json
    expected:
      violations:
        - rule: npm.scripts-no-rm-rf-root
          message_contains: "clean"
  - name: rm -rf $HOME fires
    input: '{"name":"foo","version":"1.0.0","scripts":{"reset":"rm -rf $HOME"}}'
    format: json
    expected:
      violations:
        - rule: npm.scripts-no-rm-rf-root
  - name: rm -rf ./build passes
    input: '{"name":"foo","version":"1.0.0","scripts":{"clean":"rm -rf ./build"}}'
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
  - name: scripts as a list is skipped
    input: |
      {"name":"foo","version":"1.0.0","scripts":["rm -rf /"]}
    expected:
      violations: []
