tests:
  - name: dependency on '*' fires
    input: |
      {"name":"foo","version":"1.0.0","dependencies":{"left-pad":"*"}}
    format: json
    expected:
      violations:
        - rule: npm.no-wildcard-deps
          message_contains: "left-pad"
  - name: dependency on 'latest' fires
    input: |
      {"name":"foo","version":"1.0.0","dependencies":{"react":"latest"}}
    format: json
    expected:
      violations:
        - rule: npm.no-wildcard-deps
          message_contains: "react"
  - name: pinned dependency passes
    input: |
      {"name":"foo","version":"1.0.0","dependencies":{"react":"^18.2.0"}}
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
  - name: a non-object dependency section is skipped, the others still checked
    input: |
      {"name":"foo","version":"1.0.0","dependencies":["a"],"devDependencies":{"b":"*"},"peerDependencies":"x"}
    expected:
      violations:
        - rule: npm.no-wildcard-deps
          message_contains: "'b'"
