tests:
  - name: missing repository fires
    input: '{"name":"foo","version":"1.0.0","license":"MIT"}'
    format: json
    expected:
      violations:
        - rule: npm.has-repository
  - name: repository as string passes
    input: '{"name":"foo","version":"1.0.0","repository":"https://github.com/foo/bar"}'
    format: json
    expected:
      violations: []
  - name: repository as object passes
    input: '{"name":"foo","version":"1.0.0","repository":{"type":"git","url":"https://github.com/foo/bar.git"}}'
    format: json
    expected:
      violations: []
  - name: list root produces no violations
    input: |
      [1, 2]
    expected:
      violations: []
  - name: string root produces no violations
    input: |
      "just a string"
    expected:
      violations: []
  - name: null document produces no violations (JSON has no empty document)
    input: |
      null
    expected:
      violations: []
