tests:
  - name: FROM with :latest fires
    input: |
      - { instruction: FROM, arguments: "alpine:latest", line: 1 }
      - { instruction: RUN, arguments: "apk add curl", line: 2 }
    format: yaml
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
          message_contains: ":latest"
  - name: FROM with pinned tag passes
    input: |
      - { instruction: FROM, arguments: "alpine:3.19", line: 1 }
    format: yaml
    expected:
      violations: []
  - name: FROM with no tag fires (defaults to :latest)
    input: |
      - { instruction: FROM, arguments: "alpine", line: 1 }
    format: yaml
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
  - name: an ordinary YAML mapping is not a Dockerfile
    input: |
      name: web
      image: nginx
    format: yaml
    expected:
      violations: []
  - name: a YAML list of strings is not a Dockerfile
    input: |
      - FROM
      - ADD
    format: yaml
    expected:
      violations: []
  - name: an empty YAML list is not a Dockerfile
    input: |
      []
    format: yaml
    expected:
      violations: []
