tests:
  - name: FROM with :latest fires
    input: |
      FROM alpine:latest
      RUN apk add curl
    format: dockerfile
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
          message_contains: ":latest"
  - name: FROM with pinned tag passes
    input: |
      FROM alpine:3.19
    format: dockerfile
    expected:
      violations: []
  - name: FROM with no tag fires (defaults to :latest)
    input: |
      FROM alpine
    format: dockerfile
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
  - name: a lower-case from with no tag fires
    input: |
      from alpine
    format: dockerfile
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
  - name: FROM with a platform flag and no tag fires
    input: |
      FROM --platform=linux/amd64 alpine AS build
    format: dockerfile
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
  - name: FROM with a platform flag and a pinned tag passes
    input: |
      FROM --platform=$BUILDPLATFORM golang:1.22 AS build
    format: dockerfile
    expected:
      violations: []
  - name: FROM a registry with a port and no tag fires
    input: |
      FROM localhost:5000/app
    format: dockerfile
    expected:
      violations:
        - rule: dockerfile.no-latest-base-image
  - name: FROM pinned by digest passes
    input: |
      FROM alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    format: dockerfile
    expected:
      violations: []
  - name: FROM scratch passes
    input: |
      FROM scratch
    format: dockerfile
    expected:
      violations: []
  - name: FROM a variable passes
    input: |
      ARG BASE_IMAGE=alpine:3.20
      FROM ${BASE_IMAGE}
    format: dockerfile
    expected:
      violations: []
  - name: FROM an earlier stage name passes
    input: |
      FROM golang:1.22 AS Build
      RUN go build ./...
      FROM build
    format: dockerfile
    expected:
      violations: []
  - name: an ordinary YAML file is not linted by this rule
    input: |
      name: web
      image: nginx
    format: yaml
    expected:
      violations: []
  - name: a YAML instruction list is not linted by this rule
    input: |
      - { instruction: FROM, arguments: alpine, line: 1 }
    format: yaml
    expected:
      violations: []
