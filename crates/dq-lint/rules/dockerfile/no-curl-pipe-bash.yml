id: dockerfile.no-curl-pipe-bash
description: |
  RUN steps that pipe curl/wget output directly into a shell are a
  classic supply-chain footgun: any compromise of the URL endpoint
  means arbitrary code in your image. Download first, verify a
  checksum, then execute.
severity: warn
match:
  format: [dockerfile]
check:
  # The shell text (a backslash-newline inside a heredoc body joined first)
  # is split into commands on `;`, `&&`, `||` and newlines, each command
  # into pipeline stages on `|`. A command fires when a stage runs curl/wget
  # and a later stage is a shell (`sh`, `bash`, `ash`, `dash`, `zsh`, `ksh`;
  # by path; after `sudo`, `env` and `NAME=value` assignments; a `)` may
  # close a subshell or `$(…)` right after it).
  # Exec form has no pipe unless it runs a shell (`["sh", "-c", "…"]`).
  jq: |-
    # The exec form: a JSON array, or JSON after leading `--flag` words
    # (the parser keeps `RUN --network=host ["…"]` as a string).
    def exec_args:
      if type == "array" then .
      elif type == "string" then
        sub("^(--\\S+\\s+)*"; "") | select(startswith("[")) | (try fromjson catch null)
        | select(type == "array" and all(.[]; type == "string"))
      else empty end;
    def pipes_into_shell:
      gsub("\\\\\n"; " ")
      | [splits("\\|\\||&&|;|\\n")]
      | any(.[];
          [splits("\\|")] as $stages
          | [range(0; $stages | length) as $i
             | ($stages[$i] | test("\\b(curl|wget)\\b"))
               and any($stages[$i + 1:][];
                   test("^\\s*(sudo(\\s+-\\S+)*\\s+)?([A-Za-z_][A-Za-z0-9_]*=(\"[^\"]*\"|'[^']*'|\\S*)\\s+)*((\\S*/)?env(\\s+-\\S+)*\\s+([A-Za-z_][A-Za-z0-9_]*=(\"[^\"]*\"|'[^']*'|\\S*)\\s+)*)?(\\S*/)?(ba|da|z|k|a)?sh(\\s|\\)|$)"))]
          | any);
    range(0; length) as $i | .[$i]
    | select(.instruction == "RUN")
    | select(
        ([.arguments | exec_args] | .[0]) as $exec
        | (if $exec == null then .arguments | tostring
           elif ($exec[0] // "" | test("(^|/)(ba|da|z|k|a)?sh$")) then $exec[1:] | join(" ")
           else "" end)
        | pipes_into_shell)
    | . + {pointer: "/\($i)"}
  message: "RUN pipes curl/wget into a shell"
loc:
  # The RUN instruction (its line and keyword).
  pointer: '.pointer'
references:
  - https://www.idontplaydarts.com/2016/04/detecting-curl-pipe-bash-server-side/
