id: dockerfile.no-add-use-copy
description: |
  ADD does too much (URL fetch + auto-extract); use COPY instead.
  COPY is explicit and predictable. Reserve ADD for the rare cases
  that genuinely need its archive-extraction behaviour.
severity: warn
match:
  format: [dockerfile]
check:
  # Sources are every word but the last after the flags (first line only:
  # heredoc bodies follow it), or every element but the last of the JSON
  # form. ADD passes when a source is a URL or a git remote (scheme
  # case-insensitive, quotes ignored), a local tar archive (ADD extracts
  # it) or a heredoc (inline content).
  jq: |-
    # The exec form: a JSON array, or JSON after leading `--flag` words
    # (the parser keeps `RUN --network=host ["…"]` as a string).
    def exec_args:
      if type == "array" then .
      elif type == "string" then
        sub("^(--\\S+\\s+)*"; "") | select(startswith("[")) | (try fromjson catch null)
        | select(type == "array" and all(.[]; type == "string"))
      else empty end;
    range(0; length) as $i | .[$i]
    | select(.instruction == "ADD")
    | select(
        ([.arguments | exec_args] | .[0]) as $exec
        | (if $exec != null then $exec
           else [.arguments | tostring | split("\n")[0] | match("\\S+"; "g").string]
                | map(select(startswith("--") | not)) end)
        | .[0:-1]
        | any(.[];
            ($exec == null and test("^[0-9]*<<"))
            or (gsub("[\"']"; "")
                | test("^((https?|git|ssh)://|git@)|\\.(tar(\\.(gz|bz2|xz|zst))?|tgz|tbz2?|txz|tzst)$"; "i")))
        | not)
    | . + {pointer: "/\($i)"}
  message: "ADD used for local copy; prefer COPY"
loc:
  # The ADD instruction (its line and keyword).
  pointer: '.pointer'
references:
  - https://docs.docker.com/develop/develop-images/dockerfile_best-practices/#add-or-copy
