tests:
  - name: ADD with local path fires
    input: |
      - { instruction: ADD, arguments: "./app /app", line: 5 }
    format: yaml
    expected:
      violations:
        - rule: dockerfile.no-add-use-copy
          message_contains: "line 5"
  - name: ADD with URL passes
    input: |
      - { instruction: ADD, arguments: "https://example.com/foo.tar.gz /tmp/", line: 5 }
    format: yaml
    expected:
      violations: []
  - name: COPY passes
    input: |
      - { instruction: COPY, arguments: "./app /app", line: 5 }
    format: yaml
    expected:
      violations: []
  - name: an ordinary YAML mapping is not a Dockerfile
    input: |
      name: web
      image: nginx
    format: yaml
    expected:
      violations: []
  - name: a YAML list of strings is not a Dockerfile
    input: |
      - FROM
      - ADD
    format: yaml
    expected:
      violations: []
  - name: an empty YAML list is not a Dockerfile
    input: |
      []
    format: yaml
    expected:
      violations: []
