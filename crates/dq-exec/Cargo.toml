[package]
name = "dq-exec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Sibling crates: `dq-core` provides the `Document`/`Value` model and parser
# error type that the rule schema diagnostics quote; `dq-transform`'s
# `JqEngine` is the load-bearing primitive every rule's `match.filter` and
# `check.jq` is compiled into.
dq-core = { path = "../dq-core", version = "0.1" }
dq-transform = { path = "../dq-transform", version = "0.1" }
# `dq-lint` ships the embedded `@std/<namespace>` rule library that
# `RuleSet::from_std` resolves against. Zero-runtime-dep crate; the only
# cost is the `include_str!` rule files at compile time.
dq-lint = { path = "../dq-lint", version = "0.1" }

# Core data / serialization. `serde_yml` parses the rule schema; `serde_json`
# is the lingua franca for diagnostic envelopes (matches the SARIF reporter
# contract in `dq-cli/src/output/sarif.rs`).
serde = { workspace = true }
serde_yml = { workspace = true }
serde_json = { workspace = true }

# Errors / logging.
thiserror = { workspace = true }
tracing = { workspace = true }

# Glob matching for `match.glob` patterns and rule-file discovery.
globset = { workspace = true }
# UTF-8 path types — see the `/rust-cli` skill conventions.
camino = { workspace = true }
# Ordered map for stable iteration over discovered formats / rulesets.
indexmap = { workspace = true }
# Recursive walk for `RuleSet::from_path(<dir>)` — picks up `*.yml` /
# `*.yaml` rule files while skipping `*.test.yml` / `*.test.yaml` fixtures.
walkdir = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
