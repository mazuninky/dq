[package]
name = "dq-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Sibling crates: `dq-core` provides the `Document`/`Value` model and parser
# error type that the rule schema diagnostics quote; `dq-transform`'s
# `JqEngine` is the load-bearing primitive every rule's `match.filter` and
# `check.jq` is compiled into.
dq-core = { path = "../dq-core" }
dq-transform = { path = "../dq-transform" }
# `dq-lint` ships the embedded `@std/<namespace>` rule library that
# `RuleSet::from_std` resolves against. Zero-runtime-dep crate; the only
# cost is the `include_str!` rule files at compile time.
dq-lint = { path = "../dq-lint" }

# Core data / serialization. `serde_norway` parses the rule schema; `serde_json`
# is the lingua franca for diagnostic envelopes (matches the SARIF reporter
# contract in `dq-cli/src/output/sarif.rs`).
serde = { workspace = true }
serde_norway = { workspace = true }
serde_json = { workspace = true }

# Errors / logging.
thiserror = { workspace = true }
tracing = { workspace = true }

# Glob matching for `match.glob` patterns and rule-file discovery.
globset = { workspace = true }
# UTF-8 path types — see the `/rust-cli` skill conventions.
camino = { workspace = true }
# Ordered map for stable iteration over discovered formats / rulesets.
indexmap = { workspace = true }
# Recursive walk for `RuleSet::from_path(<dir>)` — picks up `*.yml` /
# `*.yaml` rule files while skipping `*.test.yml` / `*.test.yaml` fixtures.
walkdir = { workspace = true }

# M11 Phase 3 — JSON Schema validator for `Check::Schema` /
# `Check::SchemaFile` rule variants. Compiled once per rule at
# `Evaluator::new` and reused across every `evaluate_file` call.
jsonschema = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# Criterion benchmark harness for `benches/evaluate.rs`. The `[[bench]]`
# entry below opts the file out of the default libtest harness so its
# `criterion_main!` macro runs at `cargo bench` time.
criterion = { workspace = true }
# Seeded RNG for deterministic k8s-shaped workload generation inside
# the bench file (`StdRng::seed_from_u64(42)`).
rand = { workspace = true }

[[bench]]
name = "evaluate"
harness = false
